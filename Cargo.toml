[package]
name = "light_yagami_the_ai"
version = "0.1.0"
edition = "2024"
default-run = "light_yagami_the_ai"

[dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full"] }

# LLM inference
# Repository: https://github.com/tinygrad/llama-cpp-rs
# Docs: https://docs.rs/llama_cpp
llama_cpp = "0.3.2"

# Speech recognition (offline)
# Repository: https://github.com/alphacep/vosk-api
# Crate: https://crates.io/crates/vosk
vosk = "0.3.1"

# Audio I/O
cpal = "0.16.0"
hound = "3.5"

# CLI & TUI
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.26"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP (for weather, etc.)
reqwest = { version = "0.11", features = ["json"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
log4rs = { version = "1.0.0", features = ["gzip"] }
env_logger = "0.11"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = "0.4"
regex = "1.10"
lazy_static = "1.4"
dirs = "5.0"                                           # For finding home directory
kokoro-tts = "0.3.1"
rodio = "0.21.1"
ndarray-npy = "0.10.0"
bincode = "2.0.1"
ndarray = "0.17.1"
config = "0.13.2"                                      #for config
